name: Deploy to Domus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domus-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:lint
      - name: Build for the Domus URL
        run: bun run build
        env:
          BASE_PATH: /~bergenwb
      - name: Check static output
        run: |
          test -f dist/index.html
          test -f dist/projects/index.html
          test -f dist/resume/index.html
          test -d dist/_app
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: domus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish to Domus over SFTP
        env:
          ARCADA_USERNAME: ${{ secrets.ARCADA_USERNAME }}
          ARCADA_PASSWORD: ${{ secrets.ARCADA_PASSWORD }}
        run: bun scripts/deploy-domus.ts
