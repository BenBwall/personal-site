name: Deploy to Domus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domus-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:lint-rules
      - name: Build for the Domus URL
        run: bun run build
        env:
          BASE_PATH: /~bergenwb
      - name: Check static output
        run: |
          test -f dist/index.html
          test -f dist/projects/index.html
          test -f dist/resume/index.html
          test -d dist/_app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: domus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish to Domus over SFTP
        env:
          ARCADA_USERNAME: ${{ secrets.ARCADA_USERNAME }}
          ARCADA_PASSWORD: ${{ secrets.ARCADA_PASSWORD }}
        run: node scripts/deploy-domus.js
