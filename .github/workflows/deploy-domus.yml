name: Deploy to Domus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domus-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:lint-rules
      - name: Build for the Domus URL
        run: bun run build
        env:
          BASE_PATH: /~bergenwb
      - name: Check static output
        run: |
          test -f dist/index.html
          test -f dist/projects/index.html
          test -f dist/resume/index.html
          test -d dist/_app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: domus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: site/
      - name: Mark the release
        run: printf '{"revision":"%s"}\n' "$GITHUB_SHA" > site/deployment.json
      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Publish over SFTP
        env:
          ARCADA_USERNAME: ${{ secrets.ARCADA_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.ARCADA_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$ARCADA_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]] || {
            echo 'ARCADA_USERNAME must be a bare account name.' >&2
            exit 1
          }
          : "${LFTP_PASSWORD:?Set ARCADA_PASSWORD in the domus environment}"
          umask 077
          lftp_settings() {
            printf 'set cmd:fail-exit yes\n'
            printf 'set net:max-retries 1\n'
            printf 'set net:timeout 20\n'
            printf 'set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%s/.github/domus_known_hosts"\n' "$GITHUB_WORKSPACE"
          }
          target_host=''
          target_dir=''
          for candidate in \
            'domus.sad.arcada.fi|html' \
            'people.arcada.fi|html' \
            'penti.arcada.fi|/home/b/bergenwb/html'; do
            host="${candidate%%|*}"
            dir="${candidate#*|}"
            script="$RUNNER_TEMP/domus-probe.lftp"
            marker="$RUNNER_TEMP/domus-target-marker"
            rm -f "$marker"
            {
              lftp_settings
              printf 'open --env-password --user %s sftp://%s\n' "$ARCADA_USERNAME" "$host"
              printf 'get %s/.personal-site-deploy-target -o %s\n' "$dir" "$marker"
              printf 'bye\n'
            } > "$script"
            if LFTP_HOME="$RUNNER_TEMP/lftp" lftp --norc -f "$script" && \
              cmp -s .github/domus-deploy-target "$marker"; then
              target_host="$host"
              target_dir="$dir"
              break
            fi
          done
          if [ -z "$target_host" ]; then
            echo 'No SFTP endpoint exposed the verified Domus html directory.' >&2
            exit 1
          fi
          echo "Deploying to $target_host:$target_dir"
          script="$RUNNER_TEMP/domus-publish.lftp"
          {
            lftp_settings
            printf 'open --env-password --user %s sftp://%s\n' "$ARCADA_USERNAME" "$target_host"
            printf 'mirror --reverse --delete --depth-first --no-perms --exclude-glob .htaccess --exclude-glob .personal-site-deploy-target --exclude-glob deployment.json --verbose site %s\n' "$target_dir"
            printf 'put site/deployment.json -o %s/deployment.json\n' "$target_dir"
            printf 'bye\n'
          } > "$script"
          LFTP_HOME="$RUNNER_TEMP/lftp" lftp --norc -f "$script"
      - name: Verify public release
        run: |
          set -euo pipefail
          expected="{\"revision\":\"$GITHUB_SHA\"}"
          for attempt in {1..10}; do
            actual=$(curl -fsS --connect-timeout 5 --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "https://people.arcada.fi/~bergenwb/deployment.json?rev=$GITHUB_SHA" || true)
            if [ "$actual" = "$expected" ]; then
              echo "Domus serves $GITHUB_SHA"
              exit 0
            fi
            sleep 3
          done
          echo 'The public site did not serve the deployed revision.' >&2
          exit 1
      - name: Remove temporary SFTP command file
        if: always()
        run: rm -f "$RUNNER_TEMP/domus-probe.lftp" "$RUNNER_TEMP/domus-publish.lftp" "$RUNNER_TEMP/domus-target-marker"
