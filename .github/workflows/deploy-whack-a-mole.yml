name: Deploy Whac-A-Mole to Domus

# Builds Whac-A-Mole (https://github.com/it-26-sv/whac-a-mole-bergenwb) from its private
# mirror BenBwall/whac-a-mole-bergenwb and publishes it to
# https://people.arcada.fi/~bergenwb/whack-a-mole/. See DEPLOYMENT.md. Run it from the Actions tab or with
# `gh workflow run deploy-whack-a-mole.yml -R BenBwall/personal-site -f ref=main`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of BenBwall/whac-a-mole-bergenwb to deploy
        required: true
        default: main

permissions:
  contents: read

# Its own group: it only touches html/whack-a-mole, which the personal-site deployment
# never touches, so the two may run at the same time.
concurrency:
  group: domus-whack-a-mole
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: BenBwall/whac-a-mole-bergenwb
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.WHACK_A_MOLE_DEPLOY_KEY }}
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Build for the Domus URL
        run: npx vite build --base /~bergenwb/whack-a-mole/
      - name: Check static output
        run: |
          test -f dist/index.html
          test -d dist/assets
      - uses: actions/upload-artifact@v7
        with:
          name: whack-a-mole-site
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: domus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: whack-a-mole-site
          path: whack-a-mole-site/
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish to Domus over SFTP
        env:
          ARCADA_USERNAME: ${{ secrets.ARCADA_USERNAME }}
          ARCADA_PASSWORD: ${{ secrets.ARCADA_PASSWORD }}
          WHACK_A_MOLE_REVISION: ${{ needs.build.outputs.revision }}
        run: bun scripts/deploy-whack-a-mole.ts
